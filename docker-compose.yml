volumes:
  langgraph-data:
    driver: local

services:
  langgraph-redis:
    image: redis:7
    profiles:
      - local
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 1s
      retries: 5

  langgraph-postgres:
    image: postgres:16
    profiles:
      - local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - langgraph-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s

  gravaity-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-gravaity-api:latest}
    ports:
      - "${GRAVAITY_API_PORT:-8123}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://langgraph-redis:6379}
      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING:-postgresql://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/agent/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
